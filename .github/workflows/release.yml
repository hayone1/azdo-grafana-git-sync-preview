name: Release

# Pushing a version tag builds once, publishes the build as the private dev extension, runs it in a
# real Azure Pipelines pull request build, and only then promotes the same build to the release
# extension. The published release extension is then installed and tested the same way before the
# GitHub release is created.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write # Lets azure/login exchange the GitHub OIDC token for a Microsoft Entra token.

env:
  DEV_TASK_ID: 5b0b0a8e-6f0e-4c39-9d2a-3b7c1d6e2f41 # Must match scripts/package.mjs.

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tasks/GrafanaGitSyncPreview/package-lock.json
      - run: npm ci
      - run: npm test
      - id: version
        run: |
          npm run version:set -- "${GITHUB_REF_NAME}"
          version=${GITHUB_REF_NAME#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
      - name: Package release and dev extensions
        run: |
          if [ "${{ vars.MARKETPLACE_PUBLIC }}" = "true" ]; then
            npm run package -- --all --override '{"public": true}'
          else
            npm run package -- --all
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: out/*.vsix

  publish-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: out
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish the dev extension
        run: |
          export MARKETPLACE_TOKEN=$(az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv)
          echo "::add-mask::$MARKETPLACE_TOKEN"
          scripts/publish-marketplace.sh out/*-canary-*.vsix "${{ needs.build.outputs.version }}" ${{ vars.ADO_SHARE_WITH }}

  test-dev:
    needs: [build, publish-dev]
    runs-on: ubuntu-latest
    environment: e2e
    concurrency: e2e # Every run resets the same test repository.
    env:
      AZDO_URL: ${{ vars.AZDO_URL }}
      AZDO_PROJECT: ${{ vars.AZDO_PROJECT }}
      AZDO_PAT: ${{ secrets.AZDO_PAT }}
      GRAFANA_URL: http://localhost:3000
      GRAFANA_USER: admin
      GRAFANA_PASSWORD: admin
      GIT_PROXY_URL: http://git-proxy:8080/grafana-git-sync-e2e.git
      E2E_PIPELINE_TASK: GrafanaGitSyncPreviewDev@${{ needs.build.outputs.major }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tasks/GrafanaGitSyncPreview/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install the dev extension in the test organization
        run: node scripts/install-extension.mjs "$(jq -r .publisher vss-extension.json)" "$(jq -r .id vss-extension.json)-canary" "${{ needs.build.outputs.version }}" "$DEV_TASK_ID"
      - run: npm run e2e:up
      - run: npm run test:e2e
      - if: always()
        run: npm run e2e:down

  publish:
    needs: [build, test-dev]
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: out
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Promote the tested build to the release extension
        run: |
          export MARKETPLACE_TOKEN=$(az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv)
          echo "::add-mask::$MARKETPLACE_TOKEN"
          scripts/publish-marketplace.sh "$(ls out/*.vsix | grep -v -- -canary-)" "${{ needs.build.outputs.version }}" ${{ vars.ADO_SHARE_WITH }}

  # Installs what the Marketplace now serves as the release extension and runs the same end-to-end
  # test against it. The GitHub release is created only when this passes, so a missing release
  # marks a published version that needs a look.
  verify-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    environment: e2e
    concurrency: e2e
    env:
      AZDO_URL: ${{ vars.AZDO_URL }}
      AZDO_PROJECT: ${{ vars.AZDO_PROJECT }}
      AZDO_PAT: ${{ secrets.AZDO_PAT }}
      GRAFANA_URL: http://localhost:3000
      GRAFANA_USER: admin
      GRAFANA_PASSWORD: admin
      GIT_PROXY_URL: http://git-proxy:8080/grafana-git-sync-e2e.git
      E2E_PIPELINE_TASK: GrafanaGitSyncPreview@${{ needs.build.outputs.major }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tasks/GrafanaGitSyncPreview/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install the release extension in the test organization
        run: node scripts/install-extension.mjs "$(jq -r .publisher vss-extension.json)" "$(jq -r .id vss-extension.json)" "${{ needs.build.outputs.version }}" "$(jq -r .id tasks/GrafanaGitSyncPreview/task.json)"
      - run: npm run e2e:up
      - run: npm run test:e2e
      - if: always()
        run: npm run e2e:down

  github-release:
    needs: [verify-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.vsix
          generate_release_notes: true
