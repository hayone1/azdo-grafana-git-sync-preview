name: Documentation
description: Something in the README, the task help or the docs is wrong, unclear or missing.
labels: [documentation]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Link to the section, or the task input name.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
